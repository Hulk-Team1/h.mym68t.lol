  <script>
        var packageName = "com.mym68x48725.app";

        function clickImgFun() {
            fbq('track', "pageclick", {}); 
            var cookie = document.cookie;
            var url = window.location.href;

            console.log("url："+ url);
            // 将当前URL复制到剪贴板
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() {
                    console.log('URL已复制到剪贴板');
                }, function(err) {
                    console.error('复制失败：', err);
                });
            } else {
                // 备用方案（兼容性较差）
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    console.log('URL已复制到剪贴板（备用方案）');
                } catch (err) {
                    console.error('复制失败：', err);
                }
                document.body.removeChild(textarea);
            }


            // 创建 URLSearchParams 对象，并传入 URL 查询参数
            var searchParams = new URLSearchParams(new URL(url).search);

            // 使用 get() 方法获取特定参数的值
            var fbclidValue = searchParams.get('fbclid');

            if (isIOSDevice()) {
                window.location.href = "https://h5.mym68.com";
            } else {
                window.open("https://globeshapes.com/MYM68/com.mym68x48725.app.apk");
            }
        }

        function send2Server(name, uuid) {
            var url2 = window.location.href;
            var searchParams = new URLSearchParams(new URL(url2).search);
            var fbclidValue = searchParams.get('fbclid');
            const xhr = new XMLHttpRequest();
            const url = 'https://api.gakagame.com/api/v5/sendEvent?packageName=' + packageName + '&eventName=' + name + "&fbclid=" + fbclidValue + "&uuid=" + uuid;
            const data = {};
            const jsonData = JSON.stringify(data);
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === XMLHttpRequest.DONE) {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        console.log(response);
                    } else {
                        console.log('请求失败');
                    }
                }
            };
            xhr.send(jsonData);
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                var r = Math.random() * 16 | 0,
                    v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function isIOSDevice() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const iOS = /iPad|iPhone|iPod/.test(ua);
            const iPadOS13Up = ua.includes("Macintosh") && "ontouchend" in document;
            return iOS || iPadOS13Up;
        }
